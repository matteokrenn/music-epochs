<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik-Quiz</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: 18px; min-height: 100vh; display: flex; justify-content: center; }
  main { width: min(36em, 100%); padding: 2em 16px 3em; }
  header { text-align: center; margin-bottom: 1.6em; }
  header h1 { font-size: 2.1em; }
  header .de { font-size: 1.1em; }

  .screen[hidden] { display: none; }

  label { display: block; margin-bottom: 0.4em; }
  input[type="text"] {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.4em;
    padding: 0.7em 0.8em;
  }
  .hint { color: var(--muted); font-size: 0.85em; margin: 0.5em 0 1.2em; }

  .progress { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9em; margin-bottom: 0.4em; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-bottom: 1.4em; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--gold); transition: width 0.3s; }

  .question { font-size: 1.3em; line-height: 1.35; margin-bottom: 1em; }
  .answers { display: grid; gap: 0.6em; }
  .answers button {
    border-radius: 0.5em;
    text-align: left;
    padding: 0.8em 1em;
    background: var(--card);
    border-color: var(--line);
    line-height: 1.3;
  }
  .answers button:hover:not(:disabled) { border-color: var(--gold); }
  .answers button:disabled { opacity: 1; }
  .answers button.correct { border-color: var(--ok); background: #1d2a20; }
  .answers button.wrong { border-color: var(--bad); background: #2e1c19; }
  .answers button.dim { opacity: 0.45; }

  .feedback { margin-top: 1.2em; padding: 0.9em 1em; border-radius: 0.5em; border: 1px solid var(--line); background: var(--bg-2); line-height: 1.4; }
  .feedback .verdict { font-size: 1.15em; margin-bottom: 0.3em; }
  .feedback.ok .verdict { color: var(--ok); }
  .feedback.bad .verdict { color: var(--bad); }
  .actions { margin-top: 1.2em; text-align: right; }

  .result { text-align: center; }
  .score { font-size: 4em; color: var(--gold); line-height: 1; margin: 0.3em 0; }
  .save-msg { color: var(--muted); line-height: 1.4; margin: 1em 0 1.5em; }
</style>
</head>
<body>
<main>
  <header>
    <div class="ornament">◆ ◆ ◆</div>
    <h1>Musik-Quiz</h1>
    <div class="de">Die Epochen der Musik</div>
  </header>

  <section class="screen" id="start">
    <form id="name-form">
      <label for="name">Dein Name</label>
      <input type="text" id="name" maxlength="20" autocomplete="off" required>
      <p class="hint">12 Fragen, 1 Punkt pro richtige Antwort.</p>
      <button type="submit" class="btn-primary">Los geht's →</button>
    </form>
  </section>

  <section class="screen" id="play" hidden>
    <div class="progress"><span id="qnum"></span><span id="points"></span></div>
    <div class="bar"><div id="bar"></div></div>
    <p class="question" id="question"></p>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" hidden>
      <div class="verdict" id="verdict"></div>
      <span id="explain"></span>
    </div>
    <div class="actions"><button class="btn-primary" id="next" hidden>Weiter →</button></div>
  </section>

  <section class="screen result" id="end" hidden>
    <p id="end-name"></p>
    <div class="score" id="final"></div>
    <p class="de">Punkte</p>
    <p class="save-msg" id="save-msg">Punkte werden gespeichert …</p>
    <p>Schau auf die Präsentation, dort ist die Rangliste!</p>
    <button id="again">Nochmal spielen</button>
  </section>
</main>

<script src="config.js"></script>
<script src="db.js"></script>
<script>
  // Jede Frage: q = Frage, a = Antworten (die erste ist richtig, die Reihenfolge wird gemischt), info = Erklärung.
  const QUESTIONS = [
    {
      q: "Welche Epoche ist die älteste?",
      a: ["Mittelalter", "Barock", "Romantik", "Neue Musik"],
      info: "Das Mittelalter kommt zuerst. Dann Renaissance, Barock, Wiener Klassik, Romantik, Moderne und Neue Musik."
    },
    {
      q: "Wo gab es im Mittelalter vor allem Musik?",
      a: ["In der Kirche", "Im Radio", "Im Kino", "Im Fußballstadion"],
      info: "Im Mittelalter wurde vor allem in der Kirche gesungen."
    },
    {
      q: "Was wurde im Mittelalter erfunden?",
      a: ["Die Notenlinien", "Die Schallplatte", "Der Computer", "Die E-Gitarre"],
      info: "Mit Notenlinien konnte man Lieder zum ersten Mal richtig aufschreiben."
    },
    {
      q: "Was passiert in der Renaissance mit den Noten?",
      a: ["Sie werden zum ersten Mal gedruckt", "Sie werden verboten", "Sie werden im Computer gespeichert", "Sie werden nur noch gesungen"],
      info: "Ab 1501 wurden Noten gedruckt. Vorher musste man sie mit der Hand abschreiben."
    },
    {
      q: "Welches Instrument sieht aus wie eine Gitarre und war in der Renaissance beliebt?",
      a: ["Die Laute", "Die Tuba", "Der Synthesizer", "Das Schlagzeug"],
      info: "Die Laute war das beliebteste Instrument der Renaissance."
    },
    {
      q: "Wer hat „Die vier Jahreszeiten“ geschrieben?",
      a: ["Antonio Vivaldi", "Ludwig van Beethoven", "Frédéric Chopin", "John Cage"],
      info: "„Die vier Jahreszeiten“ sind von Vivaldi, aus dem Barock."
    },
    {
      q: "Welche Epoche endet 1750, als Bach stirbt?",
      a: ["Barock", "Mittelalter", "Romantik", "Moderne"],
      info: "Mit dem Tod von Johann Sebastian Bach endet der Barock."
    },
    {
      q: "In welcher Stadt lebten Haydn, Mozart und Beethoven?",
      a: ["Wien", "Paris", "Berlin", "Rom"],
      info: "Deshalb heißt die Epoche „Wiener Klassik“."
    },
    {
      q: "Wer hat „Eine kleine Nachtmusik“ geschrieben?",
      a: ["Wolfgang Amadeus Mozart", "Johann Sebastian Bach", "Frédéric Chopin", "Claude Debussy"],
      info: "„Eine kleine Nachtmusik“ ist eines der bekanntesten Stücke von Mozart."
    },
    {
      q: "Worum geht es in der Musik der Romantik?",
      a: ["Um Gefühle, Natur und Träume", "Um Computer", "Um Fußball", "Um Mathematik"],
      info: "In der Romantik soll die Musik starke Gefühle zeigen."
    },
    {
      q: "Was passierte 1913 bei einem Konzert in Paris?",
      a: ["Das Publikum regte sich so auf, dass es Tumult gab", "Das erste Klavier wurde gebaut", "Mozart gab ein Konzert", "Es gab einen Stromausfall"],
      info: "Die Musik von Strawinsky war so neu, dass sich viele Leute aufgeregt haben."
    },
    {
      q: "Was hört man bei dem Stück „4′33″“ von John Cage?",
      a: ["Keine Töne, nur Stille und Geräusche im Raum", "Ein lautes Orchester", "Einen Chor", "Eine Orgel"],
      info: "Der Musiker spielt 4 Minuten und 33 Sekunden lang keinen einzigen Ton."
    }
  ];

  const $ = id => document.getElementById(id);
  const screens = { start: $("start"), play: $("play"), end: $("end") };
  let playerName = "";
  let index = 0;
  let score = 0;

  function show(name) {
    Object.entries(screens).forEach(([k, s]) => { s.hidden = k !== name; });
  }

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  $("name-form").addEventListener("submit", ev => {
    ev.preventDefault();
    playerName = window.DB.cleanName($("name").value);
    if (!playerName) { $("name").value = ""; $("name").focus(); return; }
    index = 0;
    score = 0;
    show("play");
    renderQuestion();
  });

  function renderQuestion() {
    const item = QUESTIONS[index];
    $("qnum").textContent = "Frage " + (index + 1) + " / " + QUESTIONS.length;
    $("points").textContent = score + " Punkte";
    $("bar").style.width = (index / QUESTIONS.length * 100) + "%";

    $("question").textContent = item.q;

    $("feedback").hidden = true;
    $("next").hidden = true;

    const box = $("answers");
    box.replaceChildren();
    shuffle(item.a).forEach(text => {
      const b = document.createElement("button");
      b.textContent = text;
      b.addEventListener("click", () => answer(b, text === item.a[0]));
      box.appendChild(b);
    });
  }

  function answer(button, isCorrect) {
    const item = QUESTIONS[index];
    if (isCorrect) score++;
    [...$("answers").children].forEach(b => {
      b.disabled = true;
      if (b.textContent === item.a[0]) b.classList.add("correct");
      else if (b === button) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    const fb = $("feedback");
    fb.className = "feedback " + (isCorrect ? "ok" : "bad");
    $("verdict").textContent = isCorrect ? "✓ Richtig!" : "✗ Leider falsch";
    $("explain").textContent = item.info;
    fb.hidden = false;
    $("points").textContent = score + " Punkte";
    const next = $("next");
    next.textContent = index === QUESTIONS.length - 1 ? "Fertig →" : "Weiter →";
    next.hidden = false;
    next.focus();
  }

  $("next").addEventListener("click", () => {
    index++;
    if (index < QUESTIONS.length) renderQuestion();
    else finish();
  });

  async function finish() {
    show("end");
    $("end-name").textContent = "Gut gemacht, " + playerName + "!";
    $("final").textContent = score + " / " + QUESTIONS.length;
    const msg = $("save-msg");
    msg.textContent = "Punkte werden gespeichert …";
    const result = await window.DB.saveScore(playerName, score);
    if (result === "saved") msg.textContent = "Deine Punkte sind jetzt in der Rangliste.";
    else if (result === "kept") msg.textContent = "Du hattest schon gleich viele oder mehr Punkte. Dein bestes Ergebnis bleibt in der Rangliste.";
    else msg.textContent = "Speichern hat nicht geklappt (keine Verbindung). Sag deine Punkte einfach laut!";
  }

  $("again").addEventListener("click", () => {
    show("start");
    $("name").value = playerName;
    $("name").focus();
  });
</script>
</body>
</html>
