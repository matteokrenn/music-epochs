<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musical Eras Quiz</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: 18px; min-height: 100vh; display: flex; justify-content: center; }
  main { width: min(36em, 100%); padding: 2em 16px 3em; }
  header { text-align: center; margin-bottom: 1.6em; }
  header h1 { font-size: 2.1em; }
  header .de { font-size: 1.1em; }

  .screen[hidden] { display: none; }

  label { display: block; margin-bottom: 0.4em; }
  input[type="text"] {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.4em;
    padding: 0.7em 0.8em;
  }
  .hint { color: var(--muted); font-size: 0.85em; margin: 0.5em 0 1.2em; }

  .progress { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9em; margin-bottom: 0.4em; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-bottom: 1.4em; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--gold); transition: width 0.3s; }

  .question { font-size: 1.3em; line-height: 1.35; margin-bottom: 1em; }
  .answers { display: grid; gap: 0.6em; }
  .answers button {
    border-radius: 0.5em;
    text-align: left;
    padding: 0.8em 1em;
    background: var(--card);
    border-color: var(--line);
    line-height: 1.3;
  }
  .answers button:hover:not(:disabled) { border-color: var(--gold); }
  .answers button:disabled { opacity: 1; }
  .answers button.correct { border-color: var(--ok); background: #1d2a20; }
  .answers button.wrong { border-color: var(--bad); background: #2e1c19; }
  .answers button.dim { opacity: 0.45; }

  .feedback { margin-top: 1.2em; padding: 0.9em 1em; border-radius: 0.5em; border: 1px solid var(--line); background: var(--bg-2); line-height: 1.4; }
  .feedback .verdict { font-size: 1.15em; margin-bottom: 0.3em; }
  .feedback.ok .verdict { color: var(--ok); }
  .feedback.bad .verdict { color: var(--bad); }
  .feedback .de { display: block; margin-top: 0.35em; font-size: 0.92em; }
  .actions { margin-top: 1.2em; text-align: right; }

  .result { text-align: center; }
  .score { font-size: 4em; color: var(--gold); line-height: 1; margin: 0.3em 0; }
  .save-msg { color: var(--muted); line-height: 1.4; margin: 1em 0 1.5em; }
</style>
</head>
<body>
<main>
  <header>
    <div class="ornament">◆ ◆ ◆</div>
    <h1>Musical Eras Quiz</h1>
    <div class="de">Quiz zu den Epochen der Musik</div>
  </header>

  <section class="screen" id="start">
    <form id="name-form">
      <label for="name">Your name · Dein Name</label>
      <input type="text" id="name" maxlength="20" autocomplete="off" required>
      <p class="hint">12 questions, 1 point each. · 12 Fragen, 1 Punkt pro richtige Antwort.</p>
      <button type="submit" class="btn-primary">Start →</button>
    </form>
  </section>

  <section class="screen" id="play" hidden>
    <div class="progress"><span id="qnum"></span><span id="points"></span></div>
    <div class="bar"><div id="bar"></div></div>
    <p class="question" id="question"></p>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" hidden>
      <div class="verdict" id="verdict"></div>
      <span id="explain"></span>
      <span class="de" id="explain-de"></span>
    </div>
    <div class="actions"><button class="btn-primary" id="next" hidden>Next →</button></div>
  </section>

  <section class="screen result" id="end" hidden>
    <p id="end-name"></p>
    <div class="score" id="final"></div>
    <p class="de">Punkte</p>
    <p class="save-msg" id="save-msg">Saving your score …</p>
    <p>Look at the big screen for the leaderboard! <span class="de">Schau auf die Präsentation für die Rangliste!</span></p>
    <button id="again">Play again · Nochmal</button>
  </section>
</main>

<script src="config.js"></script>
<script src="db.js"></script>
<script>
  // Each question: q, answers (first one is correct, order gets shuffled), explanation EN + DE.
  const QUESTIONS = [
    {
      q: "Which era comes first?",
      a: ["Middle Ages", "Renaissance", "Baroque", "Romantic"],
      en: "The Middle Ages (c. 500–1400) come first, then Renaissance, Baroque, Classical, Romantic, Modern, New Music.",
      de: "Das Mittelalter ist die älteste der sieben Epochen."
    },
    {
      q: "Who put notes on lines (a staff) in the 11th century?",
      a: ["Guido of Arezzo", "J. S. Bach", "W. A. Mozart", "John Cage"],
      en: "The monk Guido of Arezzo used lines so singers could read the pitch.",
      de: "Guido von Arezzo erfand die Notenlinien."
    },
    {
      q: "What is Gregorian chant?",
      a: ["One melody sung in Latin, without instruments", "Music for a big orchestra", "Electronic music from a studio", "Piano music for concerts"],
      en: "Gregorian chant is one-voice church singing in Latin.",
      de: "Gregorianischer Choral ist einstimmiger Kirchengesang auf Latein."
    },
    {
      q: "Which invention from 1501 helped Renaissance music spread?",
      a: ["Music printing", "The radio", "The piano", "The synthesizer"],
      en: "Ottaviano Petrucci printed the first big book of polyphonic music in Venice in 1501.",
      de: "Der Notendruck machte Musik für viel mehr Menschen zugänglich."
    },
    {
      q: "Which instrument is typical for the Renaissance?",
      a: ["Lute", "Saxophone", "Synthesizer", "Tuba"],
      en: "The lute was the most popular instrument of the Renaissance.",
      de: "Die Laute war das beliebteste Instrument der Renaissance."
    },
    {
      q: "A bass line with chords played below the music is called basso continuo. In which era?",
      a: ["Baroque", "Middle Ages", "Classical", "New Music"],
      en: "Basso continuo is the typical foundation of Baroque music.",
      de: "Der Generalbass ist typisch für den Barock."
    },
    {
      q: "Who composed \"The Four Seasons\"?",
      a: ["Antonio Vivaldi", "Ludwig van Beethoven", "Frédéric Chopin", "Arnold Schönberg"],
      en: "Vivaldi wrote The Four Seasons, four violin concertos, around 1720.",
      de: "\"Die vier Jahreszeiten\" sind Violinkonzerte von Vivaldi."
    },
    {
      q: "Which three composers belong to the Viennese Classical era?",
      a: ["Haydn, Mozart, Beethoven", "Bach, Händel, Vivaldi", "Chopin, Wagner, Schubert", "Debussy, Schönberg, Stravinsky"],
      en: "Haydn, Mozart and Beethoven all worked in Vienna.",
      de: "Haydn, Mozart und Beethoven sind die drei Wiener Klassiker."
    },
    {
      q: "Which instrument replaced the harpsichord in the Classical era?",
      a: ["Fortepiano", "Organ", "Lute", "Electric guitar"],
      en: "The fortepiano can play loud and soft, the harpsichord cannot.",
      de: "Das Hammerklavier kann laut und leise spielen, das Cembalo nicht."
    },
    {
      q: "A leitmotif is a short melody for a character. Which composer made it famous?",
      a: ["Richard Wagner", "Josquin des Prez", "Joseph Haydn", "Steve Reich"],
      en: "Wagner used leitmotifs in his Romantic operas.",
      de: "Wagner machte das Leitmotiv in seinen Opern berühmt."
    },
    {
      q: "Who invented the twelve-tone technique?",
      a: ["Arnold Schönberg", "Claude Debussy", "Giovanni P. da Palestrina", "Franz Schubert"],
      en: "Schönberg used all 12 notes in a fixed order, so no note is the \"home\" note.",
      de: "Schönberg entwickelte die Zwölftontechnik."
    },
    {
      q: "What happens in John Cage's piece 4′33″ (1952)?",
      a: ["The musician plays no notes for 4 minutes 33 seconds", "A choir sings in Latin", "An orchestra plays very loud", "A computer plays a melody"],
      en: "The music is the silence and the sounds of the room.",
      de: "Die Musik ist die Stille und die Geräusche im Raum."
    }
  ];

  const $ = id => document.getElementById(id);
  const screens = { start: $("start"), play: $("play"), end: $("end") };
  let playerName = "";
  let index = 0;
  let score = 0;

  function show(name) {
    Object.entries(screens).forEach(([k, s]) => { s.hidden = k !== name; });
  }

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  $("name-form").addEventListener("submit", ev => {
    ev.preventDefault();
    playerName = window.DB.cleanName($("name").value);
    if (!playerName) { $("name").value = ""; $("name").focus(); return; }
    index = 0;
    score = 0;
    show("play");
    renderQuestion();
  });

  function renderQuestion() {
    const item = QUESTIONS[index];
    $("qnum").textContent = "Question " + (index + 1) + " / " + QUESTIONS.length;
    $("points").textContent = score + " pts";
    $("bar").style.width = (index / QUESTIONS.length * 100) + "%";
    $("question").textContent = item.q;
    $("feedback").hidden = true;
    $("next").hidden = true;

    const box = $("answers");
    box.replaceChildren();
    shuffle(item.a).forEach(text => {
      const b = document.createElement("button");
      b.textContent = text;
      b.addEventListener("click", () => answer(b, text === item.a[0]));
      box.appendChild(b);
    });
  }

  function answer(button, isCorrect) {
    const item = QUESTIONS[index];
    if (isCorrect) score++;
    [...$("answers").children].forEach(b => {
      b.disabled = true;
      if (b.textContent === item.a[0]) b.classList.add("correct");
      else if (b === button) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    const fb = $("feedback");
    fb.className = "feedback " + (isCorrect ? "ok" : "bad");
    $("verdict").textContent = isCorrect ? "✓ Correct! · Richtig!" : "✗ Not quite · Leider falsch";
    $("explain").textContent = item.en;
    $("explain-de").textContent = item.de;
    fb.hidden = false;
    $("points").textContent = score + " pts";
    const next = $("next");
    next.textContent = index === QUESTIONS.length - 1 ? "Finish →" : "Next →";
    next.hidden = false;
    next.focus();
  }

  $("next").addEventListener("click", () => {
    index++;
    if (index < QUESTIONS.length) renderQuestion();
    else finish();
  });

  async function finish() {
    show("end");
    $("end-name").textContent = "Well done, " + playerName + "!";
    $("final").textContent = score + " / " + QUESTIONS.length;
    const msg = $("save-msg");
    msg.textContent = "Saving your score … · Punkte werden gespeichert …";
    const result = await window.DB.saveScore(playerName, score);
    if (result === "saved") msg.textContent = "Your score is on the leaderboard. · Deine Punkte sind in der Rangliste.";
    else if (result === "kept") msg.textContent = "You already had the same or a better score, so it stays on the leaderboard. · Dein besseres Ergebnis bleibt stehen.";
    else msg.textContent = "Could not save your score (no connection). Just tell your score out loud! · Speichern ging nicht, sag deine Punkte einfach laut.";
  }

  $("again").addEventListener("click", () => {
    show("start");
    $("name").value = playerName;
    $("name").focus();
  });
</script>
</body>
</html>
