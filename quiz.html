<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik-Quiz</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: 18px; min-height: 100vh; display: flex; justify-content: center; }
  main { width: min(36em, 100%); padding: 2em 16px 3em; }
  header { text-align: center; margin-bottom: 1.6em; }
  header h1 { font-size: 2.1em; }
  header .de { font-size: 1.1em; }

  .screen[hidden] { display: none; }

  label { display: block; margin-bottom: 0.4em; }
  input[type="text"] {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.4em;
    padding: 0.7em 0.8em;
  }
  .hint { color: var(--muted); font-size: 0.85em; margin: 0.5em 0 1.2em; }

  .progress { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.9em; margin-bottom: 0.4em; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-bottom: 1.4em; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--gold); transition: width 0.3s; }

  .question { font-size: 1.3em; line-height: 1.35; margin-bottom: 1em; }
  .question .tr { display: block; font-size: 0.7em; color: var(--muted); font-style: italic; margin-top: 0.3em; }
  .answers { display: grid; gap: 0.6em; }
  .answers button {
    border-radius: 0.5em;
    text-align: left;
    padding: 0.8em 1em;
    background: var(--card);
    border-color: var(--line);
    line-height: 1.3;
  }
  .answers button:hover:not(:disabled) { border-color: var(--gold); }
  .answers button:disabled { opacity: 1; }
  .answers button.correct { border-color: var(--ok); background: #1d2a20; }
  .answers button.wrong { border-color: var(--bad); background: #2e1c19; }
  .answers button.dim { opacity: 0.45; }

  .feedback { margin-top: 1.2em; padding: 0.9em 1em; border-radius: 0.5em; border: 1px solid var(--line); background: var(--bg-2); line-height: 1.4; }
  .feedback .verdict { font-size: 1.15em; margin-bottom: 0.3em; }
  .feedback.ok .verdict { color: var(--ok); }
  .feedback.bad .verdict { color: var(--bad); }
  .actions { margin-top: 1.2em; text-align: right; }

  .result { text-align: center; }
  .score { font-size: 4em; color: var(--gold); line-height: 1; margin: 0.3em 0; }
  .save-msg { color: var(--muted); line-height: 1.4; margin: 1em 0 1.5em; }
</style>
</head>
<body>
<main>
  <header>
    <div class="ornament">◆ ◆ ◆</div>
    <h1>Musik-Quiz</h1>
    <div class="de">Die Epochen der Musik</div>
  </header>

  <section class="screen" id="start">
    <form id="name-form">
      <label for="name">Dein Name</label>
      <input type="text" id="name" maxlength="20" autocomplete="off" required>
      <p class="hint">12 Fragen, 1 Punkt pro richtige Antwort.</p>
      <button type="submit" class="btn-primary">Los geht's →</button>
    </form>
  </section>

  <section class="screen" id="play" hidden>
    <div class="progress"><span id="qnum"></span><span id="points"></span></div>
    <div class="bar"><div id="bar"></div></div>
    <p class="question" id="question"></p>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" hidden>
      <div class="verdict" id="verdict"></div>
      <span id="explain"></span>
    </div>
    <div class="actions"><button class="btn-primary" id="next" hidden>Weiter →</button></div>
  </section>

  <section class="screen result" id="end" hidden>
    <p id="end-name"></p>
    <div class="score" id="final"></div>
    <p class="de">Punkte</p>
    <p class="save-msg" id="save-msg">Punkte werden gespeichert …</p>
    <p>Schau auf die Präsentation, dort ist die Rangliste!</p>
    <button id="again">Nochmal spielen</button>
  </section>
</main>

<script src="config.js"></script>
<script src="db.js"></script>
<script>
  // Jede Frage: q (Deutsch) oder { en, de } (einfaches Englisch mit Übersetzung),
  // a = Antworten (die erste ist richtig, die Reihenfolge wird gemischt), info = Erklärung.
  const QUESTIONS = [
    {
      q: { en: "Which era is first?", de: "Welche Epoche kommt zuerst?" },
      a: ["Mittelalter", "Renaissance", "Barock", "Romantik"],
      info: "Das Mittelalter (ca. 500–1400) ist die älteste Epoche. Danach kommen Renaissance, Barock, Wiener Klassik, Romantik, Moderne und Neue Musik."
    },
    {
      q: "Wer hat im 11. Jahrhundert die Notenlinien erfunden?",
      a: ["Guido von Arezzo", "Johann Sebastian Bach", "Wolfgang Amadeus Mozart", "John Cage"],
      info: "Der Mönch Guido von Arezzo schrieb die Noten auf Linien. So konnten Sänger die Tonhöhe ablesen."
    },
    {
      q: "Was ist der Gregorianische Choral?",
      a: ["Eine Melodie, auf Latein gesungen, ohne Instrumente", "Musik für ein großes Orchester", "Elektronische Musik aus dem Studio", "Klaviermusik für Konzerte"],
      info: "Der Gregorianische Choral ist einstimmiger Kirchengesang auf Latein."
    },
    {
      q: "Welche Erfindung aus dem Jahr 1501 hat die Musik der Renaissance verbreitet?",
      a: ["Der Notendruck", "Das Radio", "Das Klavier", "Der Synthesizer"],
      info: "Ottaviano Petrucci druckte 1501 in Venedig das erste große Notenbuch. Vorher musste man Noten mit der Hand abschreiben."
    },
    {
      q: { en: "Which instrument is from the Renaissance?", de: "Welches Instrument gehört zur Renaissance?" },
      a: ["Laute", "Saxofon", "Synthesizer", "Tuba"],
      info: "Die Laute war das beliebteste Instrument der Renaissance."
    },
    {
      q: "Zu welcher Epoche gehört der Generalbass (Basslinie mit Akkorden darüber)?",
      a: ["Barock", "Mittelalter", "Wiener Klassik", "Neue Musik"],
      info: "Der Generalbass ist typisch für den Barock."
    },
    {
      q: { en: "Who wrote „The Four Seasons“?", de: "Wer hat „Die vier Jahreszeiten“ geschrieben?" },
      a: ["Antonio Vivaldi", "Ludwig van Beethoven", "Frédéric Chopin", "Arnold Schönberg"],
      info: "„Die vier Jahreszeiten“ sind vier Violinkonzerte von Vivaldi."
    },
    {
      q: "Welche drei Komponisten gehören zur Wiener Klassik?",
      a: ["Haydn, Mozart, Beethoven", "Bach, Händel, Vivaldi", "Chopin, Wagner, Schubert", "Debussy, Schönberg, Strawinsky"],
      info: "Haydn, Mozart und Beethoven haben alle in Wien gearbeitet."
    },
    {
      q: "Welches Instrument hat in der Wiener Klassik das Cembalo ersetzt?",
      a: ["Das Hammerklavier", "Die Orgel", "Die Laute", "Die E-Gitarre"],
      info: "Das Hammerklavier kann laut und leise spielen, das Cembalo nicht."
    },
    {
      q: "Ein Leitmotiv ist eine kurze Melodie für eine Person. Welcher Komponist hat es berühmt gemacht?",
      a: ["Richard Wagner", "Josquin des Prez", "Joseph Haydn", "Steve Reich"],
      info: "Wagner hat in seinen Opern viele Leitmotive verwendet."
    },
    {
      q: "Wer hat die Zwölftontechnik erfunden?",
      a: ["Arnold Schönberg", "Claude Debussy", "Giovanni P. da Palestrina", "Franz Schubert"],
      info: "Bei Schönbergs Zwölftontechnik kommen alle 12 Töne in einer festen Reihe vor. Kein Ton ist der Grundton."
    },
    {
      q: "Was passiert im Stück „4′33″“ von John Cage (1952)?",
      a: ["Der Musiker spielt 4 Minuten und 33 Sekunden lang keinen Ton", "Ein Chor singt auf Latein", "Ein Orchester spielt sehr laut", "Ein Computer spielt eine Melodie"],
      info: "Die Musik sind die Stille und die Geräusche im Raum."
    }
  ];

  const $ = id => document.getElementById(id);
  const screens = { start: $("start"), play: $("play"), end: $("end") };
  let playerName = "";
  let index = 0;
  let score = 0;

  function show(name) {
    Object.entries(screens).forEach(([k, s]) => { s.hidden = k !== name; });
  }

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  $("name-form").addEventListener("submit", ev => {
    ev.preventDefault();
    playerName = window.DB.cleanName($("name").value);
    if (!playerName) { $("name").value = ""; $("name").focus(); return; }
    index = 0;
    score = 0;
    show("play");
    renderQuestion();
  });

  function renderQuestion() {
    const item = QUESTIONS[index];
    $("qnum").textContent = "Frage " + (index + 1) + " / " + QUESTIONS.length;
    $("points").textContent = score + " Punkte";
    $("bar").style.width = (index / QUESTIONS.length * 100) + "%";

    const q = $("question");
    if (typeof item.q === "string") {
      q.textContent = item.q;
    } else {
      q.textContent = item.q.en;
      const tr = document.createElement("span");
      tr.className = "tr";
      tr.textContent = item.q.de;
      q.appendChild(tr);
    }

    $("feedback").hidden = true;
    $("next").hidden = true;

    const box = $("answers");
    box.replaceChildren();
    shuffle(item.a).forEach(text => {
      const b = document.createElement("button");
      b.textContent = text;
      b.addEventListener("click", () => answer(b, text === item.a[0]));
      box.appendChild(b);
    });
  }

  function answer(button, isCorrect) {
    const item = QUESTIONS[index];
    if (isCorrect) score++;
    [...$("answers").children].forEach(b => {
      b.disabled = true;
      if (b.textContent === item.a[0]) b.classList.add("correct");
      else if (b === button) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    const fb = $("feedback");
    fb.className = "feedback " + (isCorrect ? "ok" : "bad");
    $("verdict").textContent = isCorrect ? "✓ Richtig!" : "✗ Leider falsch";
    $("explain").textContent = item.info;
    fb.hidden = false;
    $("points").textContent = score + " Punkte";
    const next = $("next");
    next.textContent = index === QUESTIONS.length - 1 ? "Fertig →" : "Weiter →";
    next.hidden = false;
    next.focus();
  }

  $("next").addEventListener("click", () => {
    index++;
    if (index < QUESTIONS.length) renderQuestion();
    else finish();
  });

  async function finish() {
    show("end");
    $("end-name").textContent = "Gut gemacht, " + playerName + "!";
    $("final").textContent = score + " / " + QUESTIONS.length;
    const msg = $("save-msg");
    msg.textContent = "Punkte werden gespeichert …";
    const result = await window.DB.saveScore(playerName, score);
    if (result === "saved") msg.textContent = "Deine Punkte sind jetzt in der Rangliste.";
    else if (result === "kept") msg.textContent = "Du hattest schon gleich viele oder mehr Punkte. Dein bestes Ergebnis bleibt in der Rangliste.";
    else msg.textContent = "Speichern hat nicht geklappt (keine Verbindung). Sag deine Punkte einfach laut!";
  }

  $("again").addEventListener("click", () => {
    show("start");
    $("name").value = playerName;
    $("name").focus();
  });
</script>
</body>
</html>
