<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik-Quiz</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: 19px; min-height: 100vh; display: flex; justify-content: center; }
  main { width: min(40em, 100%); padding: 1.6em 16px 3em; }
  header { text-align: center; margin-bottom: 1.4em; }
  header h1 { font-size: 2em; }
  .me { color: var(--muted); font-size: 0.85em; margin-top: 0.3em; min-height: 1.2em; }

  .center { text-align: center; }
  .big { font-size: 1.5em; line-height: 1.3; }
  .muted { color: var(--muted); }
  .msg { color: var(--bad); min-height: 1.3em; margin: 0.6em 0; }
  .info-msg { color: var(--gold); margin: 0 0 1em; line-height: 1.4; }

  label { display: block; margin-bottom: 0.4em; }
  input[type="text"] {
    width: 100%; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 0.4em; padding: 0.7em 0.8em;
  }

  .progress { color: var(--muted); font-size: 0.9em; margin-bottom: 0.6em; }
  .question { font-size: 1.35em; line-height: 1.35; margin: 0 0 1em; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7em; }
  .answers button {
    display: flex; align-items: center; gap: 0.7em;
    border-radius: 0.6em; text-align: left; padding: 0.9em 1em; line-height: 1.3;
    background: var(--card); border: 1px solid var(--line); min-height: 4.2em;
  }
  .answers button:hover:not(:disabled) { border-color: var(--gold); }
  @media (max-width: 520px) { .answers { grid-template-columns: 1fr; } }

  .card-box {
    background: linear-gradient(180deg, var(--card), var(--bg-2));
    border: 1px solid var(--line); border-radius: 0.7em; padding: 1.4em 1.2em; text-align: center;
  }
  .result { font-size: 2.2em; margin-bottom: 0.2em; }
  .result.ok { color: var(--ok); } .result.bad { color: var(--bad); }
  .total { font-size: 1.15em; margin-top: 0.8em; }
  .total strong { color: var(--gold); font-weight: normal; font-size: 1.3em; }
  .pop { animation: pop 0.45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="ornament">◆ ◆ ◆</div>
    <h1>Musik-Quiz</h1>
    <div class="me" id="me"></div>
  </header>
  <div id="view"><p class="center muted dots">Verbinde mit dem Quiz</p></div>
</main>

<script src="config.js"></script>
<script src="questions.js"></script>
<script src="db.js"></script>
<script>
  const Q = window.QUESTIONS;
  const view = document.getElementById("view");
  const meLine = document.getElementById("me");

  let live = null;
  let uid = null;
  let state = { phase: "lobby", q: 0 };
  let me = null;          // mein Eintrag in quiz/players
  let myKey = null;       // mein Namensschlüssel (für Rauswurf-Erkennung)
  let wasJoined = false;
  let notice = "";        // Hinweis über dem Anmeldeformular
  let myScore = null;     // mein Eintrag in quiz/scores
  let myAnswer = null;    // meine Antwort auf die aktuelle Frage
  let answerRef = null;
  let finalShownAt = 0;
  let lastKey = "";

  function el(tag, cls, text, children) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    (children || []).forEach(c => c && node.appendChild(c));
    return node;
  }

  function show(...nodes) { view.replaceChildren(...nodes); }

  function pts(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n); }

  // ---------- Start ----------
  (async () => {
    live = await window.Live.ready;
    if (!live || !(await window.Live.reachable(live))) {
      show(el("div", "card-box", null, [
        el("p", "big", "Keine Verbindung zum Quiz"),
        el("p", "muted", "Das WLAN blockiert vielleicht die Verbindung. Sag Matteo Bescheid.")
      ]));
      return;
    }
    live.auth.onAuthStateChanged(user => {
      if (!user) { live.auth.signInAnonymously().catch(err => fail(err)); return; }
      if (uid) return;
      uid = user.uid;
      listen();
    });
  })();

  function fail(err) {
    console.warn(err);
    show(el("div", "card-box", null, [
      el("p", "big", "Da ist etwas schiefgelaufen"),
      el("p", "muted", "Lade die Seite neu. Wenn es nicht klappt, sag Matteo Bescheid.")
    ]));
  }

  function listen() {
    const db = live.db;
    db.ref("quiz/state").on("value", snap => {
      const s = snap.val() || { phase: "lobby", q: 0 };
      const qChanged = s.q !== state.q || !answerRef;
      state = s;
      if (s.phase === "final" && !finalShownAt) finalShownAt = Date.now();
      if (s.phase !== "final") finalShownAt = 0;
      if (qChanged) watchAnswer();
      render();
    });
    db.ref("quiz/players/" + uid).on("value", async snap => {
      const v = snap.val();
      if (v) { me = v; myKey = v.key; wasJoined = true; notice = ""; }
      else {
        if (wasJoined) {
          const lock = myKey ? (await db.ref("quiz/names/" + myKey).once("value")).val() : null;
          notice = lock === "kicked"
            ? "Du wurdest aus dem Quiz entfernt. Bitte wähle einen anderen Namen."
            : "Ein neues Spiel wurde gestartet. Bitte melde dich nochmal an.";
        }
        me = null; wasJoined = false;
      }
      render();
    });
    db.ref("quiz/scores/" + uid).on("value", snap => { myScore = snap.val(); render(); });
  }

  function watchAnswer() {
    if (answerRef) answerRef.off();
    myAnswer = null;
    answerRef = live.db.ref("quiz/answers/" + (state.q || 0) + "/" + uid);
    answerRef.on("value", snap => { myAnswer = snap.val(); render(); });
  }

  // ---------- Anzeige ----------
  function render() {
    const key = [state.phase, state.q, !!me, myAnswer ? myAnswer.choice : "-", myScore ? myScore.q + ":" + myScore.total : "-", notice].join("|");
    if (key === lastKey) return;
    lastKey = key;
    meLine.textContent = me ? "Du spielst als: " + me.name : "";

    if (!me) return state.phase === "final" ? renderOver() : renderJoin();
    if (state.phase === "lobby") return renderLobby();
    if (state.phase === "question") return myAnswer ? renderWaiting() : renderQuestion();
    if (state.phase === "reveal" || state.phase === "board") return renderResult();
    if (state.phase === "final") return renderFinal();
  }

  function renderJoin() {
    const input = el("input");
    input.type = "text"; input.id = "name"; input.maxLength = window.Live.MAX_NAME; input.autocomplete = "off"; input.required = true;
    const msg = el("p", "msg");
    const button = el("button", "btn-primary", "Mitmachen →");
    button.type = "submit";
    const form = el("form", null, null, [
      notice ? el("p", "info-msg", notice) : null,
      el("label", null, "Wie heißt du?"),
      input, msg, button
    ]);
    form.querySelector("label").htmlFor = "name";
    form.addEventListener("submit", async ev => {
      ev.preventDefault();
      button.disabled = true;
      msg.textContent = "";
      const err = await join(input.value);
      if (err) { msg.textContent = err; button.disabled = false; input.focus(); }
    });
    show(form);
    input.focus();
  }

  async function join(rawName) {
    const name = window.Live.cleanName(rawName);
    if (!name) return "Bitte gib deinen Namen ein.";
    const key = window.Live.nameKey(name);
    const db = live.db;
    const lock = db.ref("quiz/names/" + key);
    try {
      await lock.set(uid);
    } catch (e) {
      const owner = (await lock.once("value")).val();
      if (owner !== uid) return "Dieser Name ist schon vergeben. Bitte nimm einen anderen.";
    }
    try {
      await db.ref("quiz/players/" + uid).set({ name, key, joinedAt: live.TIMESTAMP });
      return null;
    } catch (e) {
      console.warn(e);
      return "Anmelden hat nicht geklappt. Versuch es nochmal.";
    }
  }

  function renderLobby() {
    show(el("div", "card-box pop", null, [
      el("p", "big", "Du bist dabei!"),
      el("p", "muted dots", "Warte, bis das Quiz startet")
    ]));
  }

  function renderQuestion() {
    const qi = state.q;
    const item = Q[qi];
    const box = el("div", "answers");
    window.answerOrder(qi).forEach((orig, pos) => {
      const b = el("button", null, null, [el("span", "letter l" + pos, window.LETTERS[pos]), el("span", null, item.a[orig])]);
      b.addEventListener("click", () => answer(orig, box));
      box.appendChild(b);
    });
    show(
      el("p", "progress", "Frage " + (qi + 1) + " von " + Q.length),
      el("p", "question", item.q),
      box
    );
  }

  async function answer(orig, box) {
    [...box.children].forEach(b => { b.disabled = true; });
    try {
      await live.db.ref("quiz/answers/" + state.q + "/" + uid).set({ choice: orig, at: live.TIMESTAMP });
    } catch (e) {
      console.warn(e);
      show(el("div", "card-box", null, [el("p", "big", "Zu spät!"), el("p", "muted", "Die Frage ist schon vorbei.")]));
    }
  }

  function renderWaiting() {
    const pos = window.answerOrder(state.q).indexOf(myAnswer.choice);
    show(el("div", "card-box pop", null, [
      el("p", "muted", "Deine Antwort:"),
      el("p", "big", null, [el("span", "letter l" + pos, window.LETTERS[pos]), document.createTextNode(" " + Q[state.q].a[myAnswer.choice])]),
      el("p", "muted dots", "Warte auf die anderen")
    ]));
  }

  function renderResult() {
    if (!myScore || myScore.q !== state.q) {
      show(el("div", "card-box", null, [el("p", "big", "Gleich geht's weiter"), el("p", "muted", "Schau nach vorne!")]));
      return;
    }
    const r = myScore.result;
    const title = r === "right" ? "✓ Richtig!" : r === "wrong" ? "✗ Leider falsch" : "Keine Antwort";
    show(el("div", "card-box", null, [
      el("p", "result pop " + (r === "right" ? "ok" : "bad"), title),
      el("p", "big", pts(myScore.delta) + " Punkte"),
      el("p", "muted", "Richtig war: " + Q[state.q].a[0]),
      el("p", "total", null, [
        document.createTextNode("Du hast "), el("strong", null, String(myScore.total).replace("-", "−")), document.createTextNode(" Punkte"),
        el("br"),
        document.createTextNode("Platz " + myScore.rank + " von " + myScore.of)
      ])
    ]));
  }

  // Erst nach der Siegerehrung am Beamer den eigenen Platz zeigen, damit nichts verraten wird.
  function renderFinal() {
    const wait = 11000 - (Date.now() - finalShownAt);
    if (wait > 0) {
      show(el("div", "card-box pop", null, [el("p", "result", "🏆"), el("p", "big", "Schau nach vorne!"), el("p", "muted", "Jetzt kommt die Siegerehrung.")]));
      setTimeout(() => { lastKey = ""; render(); }, wait);
      return;
    }
    if (!myScore) return renderOver();
    show(el("div", "card-box pop", null, [
      el("p", "result", myScore.rank <= 3 ? "🏆" : "🎵"),
      el("p", "big", "Platz " + myScore.rank + " von " + myScore.of),
      el("p", "total", null, [el("strong", null, String(myScore.total).replace("-", "−")), document.createTextNode(" Punkte")]),
      el("p", "muted", "Danke fürs Mitspielen!")
    ]));
  }

  function renderOver() {
    show(el("div", "card-box", null, [el("p", "big", "Das Quiz ist vorbei"), el("p", "muted", "Danke fürs Mitmachen!")]));
  }
</script>
</body>
</html>
