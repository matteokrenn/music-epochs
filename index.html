<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epochen der Musik</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    font-size: clamp(14px, 1.15vw + 0.45vh, 30px);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* Timeline */
  .timeline {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.4em;
    padding: 0.9em 2.2em 0.5em;
    position: relative;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 2.2em; right: 2.2em;
    top: 1.55em;
    border-top: 1px solid var(--line);
  }
  .tl-item {
    background: none;
    border: none;
    border-radius: 0;
    padding: 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.68em;
    line-height: 1.25;
    position: relative;
  }
  .tl-item:hover { background: none; color: var(--text); }
  .tl-dot {
    display: block;
    width: 0.85em; height: 0.85em;
    margin: 0.55em auto 0.45em;
    border-radius: 50%;
    border: 1px solid var(--gold-soft);
    background: var(--bg);
  }
  .tl-item.past .tl-dot { background: var(--gold-soft); }
  .tl-item.active { color: var(--gold); }
  .tl-item.active .tl-dot { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 4px rgba(210, 173, 98, 0.2); }
  .tl-years { display: block; opacity: 0.75; font-size: 0.9em; }

  /* Slides */
  #deck { position: relative; min-height: 0; }
  .slide {
    position: absolute; inset: 0;
    padding: 0.6em 2.2em 0.4em;
    display: none;
    flex-direction: column;
    min-height: 0;
  }
  .slide.active { display: flex; animation: fade 0.35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Title slide */
  .title-slide { justify-content: center; align-items: center; text-align: center; gap: 0.6em; }
  .title-slide h1 { font-size: 4em; line-height: 1.05; }
  .title-slide .de { font-size: 1.6em; }
  .title-slide .sub { font-size: 1.05em; color: var(--muted); max-width: 34em; }
  .title-slide .by { margin-top: 1.4em; color: var(--muted); font-size: 0.95em; letter-spacing: 0.05em; }

  /* Epoch slide */
  .epoch-head { display: flex; align-items: baseline; gap: 0.7em; flex-wrap: wrap; margin-bottom: 0.55em; }
  .epoch-head .num { color: var(--gold); font-size: 0.85em; letter-spacing: 0.15em; }
  .epoch-head h2 { font-size: 2.5em; line-height: 1; }
  .epoch-head .de { font-size: 1.35em; }
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: 0.75em;
  }
  .card {
    background: linear-gradient(180deg, var(--card), var(--bg-2));
    border: 1px solid var(--line);
    border-radius: 0.5em;
    padding: 0.7em 0.95em;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card h3 {
    color: var(--gold);
    font-size: 1.05em;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.45em;
  }
  .card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.42em; }
  .card li { line-height: 1.25; padding-left: 0.9em; position: relative; font-size: 1.12em; }
  .card li::before { content: "◆"; color: var(--gold-soft); position: absolute; left: 0; font-size: 0.55em; top: 0.55em; }
  .card li .main { display: block; }
  .note { display: block; font-size: 0.8em; color: var(--muted); }
  .era-years { font-size: 2.1em; color: var(--text); line-height: 1.1; margin: 0.05em 0 0.3em; }
  .era-text { line-height: 1.3; }
  .listen-title { line-height: 1.3; margin-bottom: 0.7em; }
  .listen-card .btn { align-self: flex-start; font-size: 0.9em; }

  /* Live-Quiz (letzte Folie) */
  .quiz-slide { align-items: center; }
  #host { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; min-height: 0; position: relative; }
  .h-title { font-size: 2.5em; text-align: center; margin-top: 0.15em; }
  .h-sub { color: var(--muted); text-align: center; margin: 0.3em 0 0.7em; max-width: 34em; line-height: 1.4; }
  .h-url {
    font-size: 1.9em; color: var(--gold); text-align: center; word-break: break-all;
    padding: 0.35em 0.9em; border: 1px solid var(--gold-soft); border-radius: 0.4em; background: var(--card);
  }
  .h-count { margin: 0.9em 0 0.5em; font-size: 1.2em; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.45em; justify-content: center; max-width: 54em; overflow: auto; min-height: 0; }
  .chip { border-radius: 999px; padding: 0.3em 0.9em; background: var(--card); border: 1px solid var(--line); animation: pop 0.4s cubic-bezier(.2, 1.6, .4, 1); }
  .chip:disabled { opacity: 1; cursor: default; }
  .chip:hover:not(:disabled) { border-color: var(--bad); text-decoration: line-through; background: var(--card); }
  .h-actions { margin-top: auto; padding-top: 0.8em; display: flex; gap: 0.8em; justify-content: center; align-items: center; flex-wrap: wrap; }
  .linkish { border: none; color: var(--muted); font-size: 0.8em; text-decoration: underline; padding: 0.3em; }
  .linkish:hover { background: none; color: var(--text); }
  .h-login { display: flex; gap: 0.5em; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 0.85em; }
  .h-login input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 0.4em; padding: 0.45em 0.7em; }
  .h-err { color: var(--bad); }
  .h-toast { position: absolute; top: 0.5em; left: 50%; transform: translateX(-50%); background: #2e1c19; border: 1px solid var(--bad); padding: 0.5em 1em; border-radius: 0.4em; z-index: 5; }
  .h-top { width: 100%; display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); }
  .answered { font-size: 1.25em; }
  .answered strong { color: var(--gold); font-weight: normal; font-size: 1.3em; }
  .h-question { font-size: 2.1em; text-align: center; line-height: 1.25; margin: 0.35em 0 0.75em; max-width: 30em; }
  .tiles { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 0.7em; }
  .tile {
    display: flex; align-items: center; gap: 0.8em; padding: 0.8em 1em; position: relative; overflow: hidden;
    border-radius: 0.6em; background: var(--card); border: 1px solid var(--line); font-size: 1.35em; line-height: 1.25;
    transition: opacity 0.4s, box-shadow 0.4s;
  }
  .tile.dim { opacity: 0.35; }
  .tile.correct { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); animation: pop 0.5s cubic-bezier(.2, 1.6, .4, 1); }
  .tile .cnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile .bar { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; transition: width 0.9s ease-out; }
  .c0 .bar { background: var(--a0); } .c1 .bar { background: var(--a1); } .c2 .bar { background: var(--a2); } .c3 .bar { background: var(--a3); }
  .h-info { margin-top: 0.9em; color: var(--muted); text-align: center; font-size: 1.15em; max-width: 36em; line-height: 1.4; }
  .h-table { width: min(34em, 100%); border-collapse: collapse; font-size: 1.05em; }
  .h-table td { padding: 0.24em 0.55em; border-bottom: 1px solid var(--line); }
  .h-table .r { color: var(--muted); width: 2.4em; }
  .h-table .d, .h-table .t, .h-table .m { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .h-table .t { color: var(--gold); }
  .h-table .plus { color: var(--ok); } .h-table .minus { color: var(--bad); }
  .h-table .m { width: 3em; font-size: 0.8em; } .h-table .up { color: var(--ok); } .h-table .down { color: var(--bad); }
  .row-in { animation: rowIn 0.45s both; }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  .pop { animation: pop 0.5s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .runners { display: flex; gap: 0.8em; justify-content: center; min-height: 2.4em; margin: 0.4em 0 0.2em; flex-wrap: wrap; }
  .runner { display: flex; gap: 0.6em; align-items: baseline; padding: 0.35em 1em; border: 1px solid var(--line); border-radius: 0.5em; background: var(--card); animation: rowIn 0.6s both; }
  .runner-place { color: var(--muted); }
  .runner-pts { color: var(--muted); font-size: 0.85em; }
  .drum { font-size: 1.5em; color: var(--gold); min-height: 1.5em; margin: 0.2em 0; opacity: 0; }
  .drum.show { animation: drum 0.9s ease-in-out infinite alternate; }
  @keyframes drum { from { opacity: 0.35; transform: scale(0.97); } to { opacity: 1; transform: scale(1.05); } }
  .podium { flex: 1; min-height: 0; width: min(42em, 100%); display: flex; align-items: flex-end; justify-content: center; gap: 1em; }
  .step { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .who { opacity: 0; text-align: center; margin-bottom: 0.4em; }
  .who-name { font-size: 1.5em; }
  .who-pts { color: var(--muted); font-variant-numeric: tabular-nums; }
  .step.p1 .who-name { font-size: 2.1em; color: var(--gold); }
  .step.show .who { animation: pop 0.6s 0.6s cubic-bezier(.2, 1.6, .4, 1) both; }
  .block {
    width: 100%; height: 0; overflow: hidden; border-radius: 0.5em 0.5em 0 0;
    display: flex; justify-content: center; padding-top: 0.3em;
    font-size: 2.2em; color: #1a140c; background: linear-gradient(180deg, #e2c07a, #8c7442);
    transition: height 0.9s cubic-bezier(.2, .9, .3, 1.15);
  }
  .step.p2 .block { background: linear-gradient(180deg, #d9d4cb, #8f8a80); }
  .step.p3 .block { background: linear-gradient(180deg, #c9885a, #7a4f32); }
  .step.p1.show .block { height: 62%; }
  .step.p2.show .block { height: 46%; }
  .step.p3.show .block { height: 34%; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

  /* Controls */
  .controls {
    display: flex; justify-content: center; align-items: center; gap: 1.2em;
    padding: 0.4em 0 0.75em;
    font-size: 0.85em;
  }
  #counter { color: var(--muted); min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }

  /* Narrow screens (phone): stack the cards and allow scrolling */
  @media (max-width: 760px) {
    html, body { overflow: auto; height: auto; }
    body { font-size: 15px; }
    .slide { position: static; padding: 0.6em 1em; }
    .grid { grid-template-columns: 1fr; grid-template-rows: none; }
    .timeline { padding: 0.8em 1em 0.4em; }
    .timeline::before { left: 1em; right: 1em; }
    .tl-name, .tl-years { display: none; }
    .title-slide h1 { font-size: 2.6em; }
  }

  /* PDF export: Ctrl+P -> "Save as PDF", landscape, no margins */
  @media print {
    @page { size: 297mm 167mm; margin: 0; }
    html, body { height: auto; overflow: visible; background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { display: block; font-size: 12.5pt; }
    .timeline, .controls { display: none; }
    #deck { position: static; }
    .slide, .slide.active {
      position: relative; display: flex; animation: none;
      height: 167mm; padding: 9mm 12mm;
      break-after: page; page-break-after: always;
      background: var(--bg);
    }
    .epoch:nth-last-child(2) { break-after: auto; page-break-after: auto; }
    .print-hide { display: none !important; }
    .listen-card .btn { border: none; padding: 0; color: var(--gold); }
  }
</style>
</head>
<body>
  <header><nav class="timeline" id="timeline" aria-label="Zeitleiste der Epochen"></nav></header>
  <main id="deck"></main>
  <footer class="controls">
    <button id="prev" aria-label="Vorherige Folie">← Zurück</button>
    <span id="counter"></span>
    <button id="next" aria-label="Nächste Folie">Weiter →</button>
  </footer>

  <script src="config.js"></script>
  <script src="epochs.js"></script>
  <script src="questions.js"></script>
  <script src="db.js"></script>
  <script src="host.js"></script>
  <script>
    const EPOCHS = window.EPOCHS;
    const deck = document.getElementById("deck");
    const timeline = document.getElementById("timeline");

    // Tiny helper: el("div", "class", "text", [children])
    function el(tag, cls, text, children) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      (children || []).forEach(c => c && node.appendChild(c));
      return node;
    }

    // Jahreszahlen wie "1685–1759" und "1. Satz" nicht mitten im Wort umbrechen
    function noBreak(text) {
      return text.replace(/(\d)–(\d)/g, "$1\u2060–\u2060$2").replace(/(\d\.) /g, "$1\u00a0");
    }

    // Punkt: ["Text", "kleine Notiz"]
    function pointList(points) {
      return el("ul", null, null, points.map(([main, note]) =>
        el("li", null, null, [el("span", "main", noBreak(main)), note ? el("span", "note", note) : null])
      ));
    }

    function card(title, body, extraClass) {
      return el("div", "card" + (extraClass ? " " + extraClass : ""), null, [el("h3", null, title)].concat(body));
    }

    function listenUrl(l) {
      return l.url || "https://www.youtube.com/results?search_query=" + encodeURIComponent(l.query);
    }

    // ---------- Build slides ----------
    const slides = [];

    slides.push(el("section", "slide title-slide", null, [
      el("div", "ornament", "◆ ◆ ◆"),
      el("h1", null, "Die Epochen der Musik"),
      el("p", "sub", "7 Epochen, von ganz alt bis heute."),
      el("p", "by", "Matteo · Musik · November 2026")
    ]));

    EPOCHS.forEach((e, i) => {
      const link = el("a", "btn", "▶ Jetzt anhören");
      link.href = listenUrl(e.listening);
      link.target = "_blank";
      link.rel = "noopener";

      slides.push(el("section", "slide epoch", null, [
        el("div", "epoch-head", null, [
          el("span", "num", (i + 1) + " / " + EPOCHS.length),
          el("h2", null, e.name)
        ]),
        el("div", "grid", null, [
          card("Zeitraum", [
            el("div", "era-years", e.years),
            el("div", "era-text", e.era)
          ]),
          card("Komponisten", [pointList(e.artists)]),
          card("Merkmale", [pointList(e.characteristics)]),
          card("Neuerungen", [pointList(e.innovations)]),
          card("Instrumente", [pointList(e.instruments)]),
          card("Hörbeispiel", [el("div", "listen-title", noBreak(e.listening.title)), link], "listen-card")
        ])
      ]));
    });

    const hostBox = el("div");
    hostBox.id = "host";
    const quizSlide = el("section", "slide quiz-slide print-hide", null, [hostBox]);
    slides.push(quizSlide);

    slides.forEach(s => deck.appendChild(s));

    // ---------- Timeline ----------
    const tlItems = EPOCHS.map((e, i) => {
      const b = el("button", "tl-item", null, [
        el("span", "tl-dot"),
        el("span", "tl-name", e.name),
        el("span", "tl-years", e.years)
      ]);
      b.title = e.name + " (" + e.years + ")";
      b.addEventListener("click", () => go(i + 1));
      timeline.appendChild(b);
      return b;
    });

    // ---------- Navigation ----------
    let current = 0;
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const counter = document.getElementById("counter");

    function go(n) {
      current = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, i) => s.classList.toggle("active", i === current));
      const epochIndex = current - 1; // slide 1..7 = epochs
      tlItems.forEach((t, i) => {
        t.classList.toggle("active", i === epochIndex);
        t.classList.toggle("past", i < epochIndex || current === slides.length - 1);
      });
      counter.textContent = (current + 1) + " / " + slides.length;
      prev.disabled = current === 0;
      next.disabled = current === slides.length - 1;
      history.replaceState(null, "", "#" + (current + 1));
    }

    prev.addEventListener("click", () => go(current - 1));
    next.addEventListener("click", () => go(current + 1));
    document.addEventListener("keydown", ev => {
      if (ev.target.closest && ev.target.closest("input, button, a")) {
        if (ev.target.matches("input") || ev.key === " " || ev.key === "Enter") return;
      }
      if (["ArrowRight", "PageDown", " "].includes(ev.key)) {
        ev.preventDefault();
        // Auf der Quiz-Folie steuert "Weiter" das Quiz
        if (slides[current] === quizSlide && window.Host.primary()) return;
        go(current + 1);
      }
      if (["ArrowLeft", "PageUp"].includes(ev.key)) { ev.preventDefault(); go(current - 1); }
      if (ev.key === "Home") go(0);
      if (ev.key === "End") go(slides.length - 1);
    });

    const start = parseInt(location.hash.slice(1), 10);
    go(Number.isFinite(start) ? start - 1 : 0);

    window.Host.init(hostBox);
  </script>
</body>
</html>
